version: '3.5'

networks:
  agent:

services:
  frontend:
    image: lcp-frontend:0.0.2
    build:
      context: ../frontend
      dockerfile: build/Dockerfile
    env_file:
      - .env
    networks:
      - agent
    stdin_open: true
    tty: true
    volumes:
      - ../frontend:/app
    ports:
      - 5173:5173
      - 8001:8001
    # command: ["npm", "run","start"]