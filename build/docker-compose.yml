version: '3.5'

networks:
  agent:

services:
  agent:
    image: cpl-agent:${AGENT_VERSION}
    build:
      context: ../agents
      dockerfile: build/Dockerfile
    env_file:
      - .env
    networks:
      - agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    volumes:
      - ../agents/src:/src
      - ../data:/data
    ports:
      - 8888:8888
      - 5001:5000
